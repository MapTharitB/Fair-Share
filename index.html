<!DOCTYPE html>
<html lang="th">
<head>
<!-- หารจ่าย แฟร์ๆ v1.08 — UX Design by Map Tharit Banchanurat -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หารจ่าย แฟร์ๆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@700;800&family=Prompt:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#18150F;--surface:#211D17;--card:#2A2520;--card-h:#322D27;
  --b:#38332C;--bl:#463F36;--t:#F0EAE0;--tm:#87807A;--td:#524D47;
  --a:#C87D3E;--ah:#D9924A;--ad:rgba(200,125,62,0.14);
  --lk:#7BBFD8;--lkb:rgba(123,191,216,0.1);--lkbl:rgba(123,191,216,0.3);
  --rh:#D45050;--rhb:rgba(212,80,80,0.12);--rhbl:rgba(212,80,80,0.28);
  --rs:#C9A83A;--rsb:rgba(201,168,58,0.12);--rsbl:rgba(201,168,58,0.28);
  --ok:#5FAA78;--okb:rgba(95,170,120,0.12);--okbl:rgba(95,170,120,0.25);
  --r:14px;--rs2:9px;--tr:0.15s ease;--hdr-h:52px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Sarabun',sans-serif;font-size:15px;background:var(--bg);color:var(--t);overflow-y:auto;-webkit-overflow-scrolling:touch;}
body.subpage{background:#241E18}
#app{display:flex;flex-direction:column;min-height:100dvh}
#hdr{display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:var(--hdr-h);background:var(--surface);border-bottom:1px solid var(--b);position:sticky;top:0;z-index:100;gap:10px;flex-shrink:0}
.hdr-l{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
#hdr-title{display:flex;align-items:baseline;gap:3px;white-space:nowrap;overflow:hidden}
.title-pre{font-family:'Prompt',sans-serif;font-size:20px;font-weight:400;color:var(--tm);letter-spacing:.2px;flex-shrink:0}
.title-main{font-family:'Kanit',sans-serif;font-size:28px;font-weight:800;color:var(--a);letter-spacing:-.5px;flex-shrink:0;line-height:1}
#hdr-title.subpage-title{display:block;font-family:'Sarabun',sans-serif;font-size:16px;font-weight:600;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;padding-bottom:3px;}
.btn-back{background:none;border:none;cursor:pointer;color:var(--tm);display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:var(--rs2);transition:all var(--tr);flex-shrink:0;padding:0}
.btn-back:hover{color:var(--t);background:var(--card)}
.btn-back svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-newbill{background:none;border:1px solid var(--bl);cursor:pointer;color:var(--tm);font-family:'Sarabun',sans-serif;font-size:13px;font-weight:500;padding:6px 11px;border-radius:var(--rs2);transition:all var(--tr);white-space:nowrap;flex-shrink:0}
.btn-newbill:hover{color:var(--a);border-color:var(--a)}
#top-tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--b);position:sticky;top:var(--hdr-h);z-index:99}
.tab-btn{flex:1;padding:11px 8px;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:13px;font-weight:600;color:var(--td);transition:color var(--tr),border-color var(--tr);display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn.active{color:var(--a);border-bottom-color:var(--a)}
.tab-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes tabGlowPulse{0%,100%{color:var(--td);text-shadow:none;}50%{color:#f0b050;text-shadow:0 0 8px rgba(240,176,80,0.95),0 0 18px rgba(200,125,62,0.55);}}
.tab-btn.tab-glow{animation:tabGlowPulse 1.2s ease-in-out infinite;}
#main{flex:1 1 auto;display:flex;flex-direction:column;min-height:0}
.screen{display:none;padding:16px;padding-bottom:52px;flex-direction:column;}
.screen.active{display:flex;flex:1;}
#screen-item-detail{padding:0;padding-bottom:84px;}
#screen-people{padding-bottom:84px;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 18px;border-radius:var(--rs2);border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:14px;font-weight:500;transition:all var(--tr)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.btn-p{background:var(--a);color:#150E00}.btn-p:hover:not(:disabled){background:var(--ah)}
.btn-s{background:var(--card);color:var(--t);border:1px solid var(--bl)}.btn-s:hover:not(:disabled){background:var(--card-h)}
.btn-g{background:none;color:var(--tm);padding:8px 12px;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:14px}.btn-g:hover{color:var(--t)}
.btn-d{background:var(--rhb);color:var(--rh);border:1px solid var(--rhbl)}.btn-d:hover{background:rgba(212,80,80,.22)}
.btn-d-strong{background:var(--rh);color:#fff;border:1px solid var(--rh);font-weight:600}.btn-d-strong:hover{background:#c03a3a;border-color:#c03a3a}
.btn-warn{background:var(--rsb);color:var(--rs);border:1px solid var(--rsbl);font-weight:500}.btn-warn:hover{background:rgba(201,168,58,.22)}
.btn-icon{background:none;border:none;cursor:pointer;color:var(--tm);display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:var(--rs2);transition:all var(--tr);padding:0;flex-shrink:0}
.btn-icon:hover{color:var(--t);background:var(--card)}
.btn-icon svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--b);overflow:hidden}
.li{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--b);transition:background var(--tr);gap:10px}
.li:last-child{border-bottom:none}
.li:hover{background:var(--card-h)}
.li-c{flex:1;min-width:0}
.li-t{font-size:15px;font-weight:500;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;line-height:1.5;padding-bottom:1px}
.li-s{font-size:12px;color:var(--tm);margin-top:2px;font-feature-settings:"tnum"}
.li-r{display:flex;align-items:center;gap:5px;flex-shrink:0}
.badge-item{display:inline-flex;align-items:center;padding:2px 8px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.ba{background:var(--okb);color:var(--ok)}.bf{background:var(--lkb);color:var(--lk)}.bz{background:var(--rsb);color:var(--rs)}
.shdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;margin-top:18px}
.shdr:first-child{margin-top:0}
.stitle{font-size:11px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;color:var(--td)}
.inp{background:var(--bg);border:1px solid var(--bl);border-radius:var(--rs2);color:var(--t);font-family:'Sarabun',sans-serif;font-size:16px;padding:10px 12px 12px;width:100%;transition:border-color var(--tr);outline:none;line-height:1.6}
.inp::placeholder{line-height:1.6;color:var(--td)}
.inp:focus{border-color:var(--a)}
.inp-lbl{font-size:12px;font-weight:500;color:var(--tm);margin-bottom:5px;display:block}
.inp-err{font-size:12px;color:var(--rh);margin-top:4px}
.flbl{font-size:9px;font-weight:700;color:var(--td);letter-spacing:.8px;text-transform:uppercase}
.fi{background:var(--bg);border:1px solid var(--bl);border-radius:7px;color:var(--t);font-family:'Sarabun',sans-serif;font-size:16px;padding:7px 9px;width:100%;text-align:right;outline:none;transition:border-color var(--tr)}
.fi:focus{border-color:var(--a)}.fi:disabled{color:var(--td);cursor:not-allowed;background:var(--card);border-color:var(--b)}
.fi.fl{color:var(--lk);border-color:var(--lkbl);background:var(--lkb)}
.fi.fa{color:var(--tm)}
.lkb{background:none;border:1px solid transparent;border-radius:7px;color:var(--td);cursor:pointer;display:flex;align-items:center;justify-content:center;width:32px;height:32px;flex-shrink:0;transition:all var(--tr);padding:0}
.lkb:hover:not(:disabled){border-color:var(--bl);color:var(--tm)}.lkb:disabled{opacity:.3;cursor:not-allowed}
.lkb.lk{background:var(--lkb);border-color:var(--lkbl);color:var(--lk)}
.lkb svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tgl{display:flex;background:var(--bg);border-radius:var(--rs2);border:1px solid var(--b);overflow:hidden}
.tgl-b{flex:1;padding:7px 10px;background:none;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:12px;font-weight:500;color:var(--tm);transition:all var(--tr);white-space:nowrap}
.tgl-b.act{background:var(--ad);color:var(--a)}
.tgl-b:disabled{opacity:.45;cursor:not-allowed}
.mtgl{display:flex;background:var(--bg);border-radius:100px;border:1px solid var(--b);padding:2px}
.mtgl-b{padding:2px 9px;border-radius:100px;background:none;border:none;cursor:pointer;font-family:'Sarabun',sans-serif;font-size:11px;font-weight:500;color:var(--tm);transition:all var(--tr)}
.mtgl-b.act{background:var(--card);color:var(--t)}
.wb{border-radius:var(--rs2);padding:10px 13px;font-size:13px;line-height:1.45;margin-bottom:5px}
.wb:last-child{margin-bottom:0}
.wb-ok{background:var(--okb);border:1px solid var(--okbl);color:var(--ok)}
.wb-w{background:var(--rsb);border:1px solid var(--rsbl);color:var(--rs)}
.wb-n{background:var(--card);border:1px solid var(--b);color:var(--td);font-style:italic}
#item-warn-area .wb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:3px;}
#item-warn-area .wb:last-child{margin-bottom:0}
.warn-lnk{color:var(--rs);text-decoration:underline;cursor:pointer}
.adj-iw{position:relative;display:flex;align-items:center}
.adj-inp{width:100%;background:var(--bg);border:1px solid var(--bl);border-radius:6px;color:var(--t);font-family:'Sarabun',sans-serif;font-size:16px;padding:6px 22px 6px 7px;text-align:right;outline:none;transition:border-color var(--tr)}
.adj-inp:focus{border-color:var(--a)}.adj-inp:disabled{color:var(--td);background:rgba(0,0,0,.15);cursor:not-allowed;opacity:.5}
.adj-sym{position:absolute;right:10px;font-size:11px;color:var(--tm);pointer-events:none}
.totals{background:var(--card);border-radius:var(--r);border:1px solid var(--b);overflow:hidden;margin-top:13px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--b);font-size:14px}
.trow:last-child{border-bottom:none}
.trow.grand{font-size:15px;font-weight:600;background:rgba(200,125,62,.06)}
.tlbl{color:var(--tm)}.tval{color:var(--t);font-weight:500;font-feature-settings:"tnum"}
.tval.neg{color:var(--rh)}.tval.pos{color:var(--a)}
.scard{background:var(--card);border-radius:var(--r);border:1px solid var(--b);overflow:hidden;margin-bottom:9px}
.scard-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px;gap:10px;cursor:pointer;user-select:none;transition:background var(--tr)}
.scard-hdr:hover{background:var(--card-h)}
.sname{font-size:15px;font-weight:600;color:var(--t);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;padding-bottom:2px}
.stot{font-size:16px;font-weight:700;color:var(--a);font-feature-settings:"tnum";flex-shrink:0}
.stot.neg{color:var(--rh)}
.sbd{border-top:1px solid var(--b);padding:4px 14px 10px}
.pdrow{display:flex;align-items:center;padding:10px 0;border-bottom:1px solid var(--b);gap:10px}
.pdrow:last-child{border-bottom:none}
.pdi{flex:1;min-width:0}
.pdn{font-size:14px;font-weight:500;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;padding-bottom:1px;}
.pds{font-size:12px;color:var(--tm);display:flex;gap:5px;margin-top:2px;font-feature-settings:"tnum";flex-wrap:wrap;align-items:center;line-height:1.6;padding-bottom:2px;}
.pdr{display:flex;align-items:center;gap:4px;flex-shrink:0}
.lk-chip{font-size:10px;color:var(--lk);background:var(--lkb);border:1px solid var(--lkbl);border-radius:4px;padding:1px 5px;font-weight:600}
.coll-btns{display:flex;gap:6px}
.coll-btn{background:none;border:1px solid var(--b);border-radius:100px;color:var(--td);font-family:'Sarabun',sans-serif;font-size:11px;font-weight:500;padding:3px 10px;cursor:pointer;transition:all var(--tr)}
.coll-btn:hover{border-color:var(--a);color:var(--a)}
.coll-btn.act{border-color:var(--a);color:var(--a);background:var(--ad)}
.coll-chev{width:15px;height:15px;stroke:var(--td);fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;transition:transform .18s ease}
.coll-chev.open{transform:rotate(0deg)}.coll-chev.closed{transform:rotate(-90deg)}
#modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center;z-index:1000;backdrop-filter:blur(5px);opacity:0;pointer-events:none;transition:opacity .2s ease}
#modal-ov.vis{opacity:1;pointer-events:all}
#modal-box{background:var(--surface);border:1px solid var(--bl);border-top-left-radius:var(--r);border-top-right-radius:var(--r);padding:22px 20px 32px;width:100%;max-width:700px;transform:translateY(40px);transition:transform .25s cubic-bezier(.34,1.1,.64,1)}
#modal-ov.vis #modal-box{transform:translateY(0)}
#modal-title{font-family:'Prompt',sans-serif;font-size:18px;font-weight:600;color:var(--t);margin-bottom:8px}
#modal-title em,#modal-body em{font-style:italic}
#modal-body{font-size:13px;color:var(--tm);margin-bottom:18px;line-height:1.5}
#modal-acts{display:flex;gap:8px}
#modal-acts.row{flex-direction:row}#modal-acts.col{flex-direction:column}
#modal-acts .btn{flex:1;justify-content:center;padding:12px}
.dh{width:34px;height:4px;background:var(--bl);border-radius:2px;margin:0 auto 16px}
.empty{text-align:center;padding:36px 20px;color:var(--tm)}
.empty-ico{font-size:36px;margin-bottom:10px;opacity:.35}.empty-txt{font-size:14px}
#toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(12px);background:var(--surface);border:1px solid var(--bl);border-radius:100px;padding:9px 18px;font-size:13px;color:var(--t);opacity:0;transition:all .25s ease;pointer-events:none;white-space:nowrap;z-index:9999;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#app-footer{flex-shrink:0;background:transparent;border-top:1px solid rgba(56,51,44,0.32);display:flex;align-items:center;justify-content:center;min-height:22px;padding:3px 16px;padding-bottom:max(3px,env(safe-area-inset-bottom,0px));}
.credit-row{display:flex;justify-content:center;align-items:center;position:relative;width:100%;}
.credit-by{font-size:10px;color:var(--td);opacity:0.55;letter-spacing:.1px;}
.credit-ver{position:absolute;right:0;font-size:9px;color:var(--td);opacity:0.35;font-feature-settings:'tnum';letter-spacing:.3px;}
.chevron{width:15px;height:15px;stroke:var(--td);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
input[type=checkbox]{accent-color:var(--a);width:16px;height:16px;cursor:pointer;flex-shrink:0}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--b);border-radius:3px}
#sticky-done-wrap{position:sticky;bottom:0;z-index:90;background:var(--surface);border-top:1px solid var(--bl);padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px));display:none;}
.per-person-sticky{position:sticky;z-index:50;background:var(--bg);margin:14px -16px 0;padding:8px 16px;border-bottom:1px solid var(--b);display:flex;align-items:center;justify-content:space-between;}
.adj-bar-row{display:flex;gap:9px;margin-bottom:9px}
.adj-bar{flex:1;background:var(--card);border-radius:var(--r);border:1px solid var(--b);padding:10px;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.adj-bar-label{font-size:11px;font-weight:600;text-align:center;white-space:nowrap}
.adj-bar-ctrl{display:flex;align-items:center;gap:5px;flex-shrink:0}
.adj-bar.ab-wide{flex-direction:row;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
.adj-bar.ab-wide .adj-bar-label{font-size:13px;font-weight:500;text-align:left}
.disc-placement-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--b);border-radius:var(--rs2);padding:8px 12px;margin-bottom:18px;gap:8px;transition:opacity var(--tr)}
.disc-placement-row.dim{opacity:0.38;pointer-events:none}
.disc-placement-label{font-size:12px;color:var(--tm);white-space:nowrap;flex-shrink:0}
.dist-bar-row{display:flex;gap:9px;margin-bottom:14px}
.dist-bar{flex:1;background:var(--card);border-radius:var(--r);border:1px solid var(--b);padding:10px;display:flex;flex-direction:column;align-items:center;gap:7px;min-width:0}
.dist-bar-label{font-size:11px;font-weight:600;color:var(--tm);text-align:center;white-space:nowrap}
.dist-bar-ctrl{display:flex;align-items:center;flex-shrink:0}
.dist-bar.dist-bar-wide{flex-direction:row;justify-content:space-between;align-items:center;padding:10px 14px;gap:10px}
.dist-bar.dist-bar-wide .dist-bar-label{font-size:13px;font-weight:500;text-align:left;color:var(--tm)}
.dist-bar.disabled-bar{opacity:0.4;pointer-events:none}
.p2col{display:grid;grid-template-columns:1fr 1fr;background:var(--b)}
.p2cell{background:var(--card);display:flex;align-items:center;gap:5px;padding:10px 11px;transition:background var(--tr);min-width:0}
.p2cell:hover{background:var(--card-h)}
.p2cell-name{flex:1;min-width:0;font-size:14px;font-weight:500;color:var(--t);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.5;padding-bottom:2px}
.p2cell-edit{grid-column:1/-1;background:var(--card-h);display:flex;align-items:center;gap:7px;padding:9px 12px}
#item-warn-sticky{position:sticky;top:var(--hdr-h);z-index:98;background:#241E18;border-bottom:1px solid var(--b);padding:6px 16px 8px;}
#hdr-item-total{display:none;font-size:15px;font-weight:700;color:var(--a);font-feature-settings:'tnum';white-space:nowrap;flex-shrink:0;}
#item-scroll-body{padding:12px 16px 0;}
.field-lbl{display:block;font-size:9px;font-weight:700;color:var(--td);letter-spacing:.8px;text-transform:uppercase;margin-bottom:3px;}
.it-total-val{font-size:15px;font-weight:700;color:var(--a);font-feature-settings:'tnum';white-space:nowrap;}
@media(max-width:500px){
  #disc-sym{display:none;}
  #disc-adj-iw{width:50px!important;}
  #adj-disc{padding-left:3px!important;padding-right:3px!important;text-align:center!important;}
  #disc-adj-bar .mtgl-b{padding-left:5px!important;padding-right:5px!important;}
}
input{font-size:16px;}
</style>
</head>
<body>
<div id="app">
<header id="hdr">
  <div class="hdr-l">
    <button class="btn-back" id="btn-back" style="display:none">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div id="hdr-title">
      <span class="title-pre">หารจ่าย</span>
      <span class="title-main">แฟร์ๆ</span>
    </div>
  </div>
  <div id="hdr-item-total"></div>
  <button class="btn-newbill" id="btn-newbill">บิลใหม่</button>
</header>
<div id="top-tabs">
  <button class="tab-btn active" data-tab="menu">
    <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
    เมนู
  </button>
  <button class="tab-btn" data-tab="summary">
    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    สรุปยอด
  </button>
</div>
<main id="main">

function getWarns(item){

function bindItemSplitInput(inp,{onInput,onCommit}){inp.addEventListener('focus',()=>inp.select());inp.addEventListener('input',onInput);inp.addEventListener('blur',onCommit);inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();onCommit();inp.blur();}});inp.addEventListener('beforeinput',e=>{if(e.inputType==='insertLineBreak'){e.preventDefault();onCommit();inp.blur();}});inp.addEventListener('paste',e=>{e.preventDefault();inp.value=(e.clipboardData||window.clipboardData).getData('text');inp.dispatchEvent(new Event('input'));});}
function bindItemAmtInput(inp,item){const pid=inp.dataset.pid;bindItemSplitInput(inp,{onInput:()=>{const oldVal=inp.value,oldPos=inp.selectionStart,raw=oldVal.replace(/,/g,'');if(!/[+\-*/]/.test(raw)){let s=NI.stripRaw(raw);s=NI.normDots(s);s=NI.normLeading(s);s=NI.limitInt(s,8);s=NI.truncDec(s,2);const nv=NI.addCommas(s);if(nv!==oldVal){inp.value=nv;NI.restoreCursor(inp,oldVal,nv,oldPos);}}const v=NI.parse(inp.value,true);if(v!==null&&isFinite(v)&&v>=0){const total=getItemTotal(item);if(total>0&&v>total){inp.value=fmtComma(total);livePreviewSplit(item,pid,total,'amt');return;}livePreviewSplit(item,pid,v,'amt');}},onCommit:()=>{const a=item.assignments.find(x=>x.personId===pid);if(!a)return;const t=getItemTotal(item);if(!t){inp.value='0.00';return;}let v=NI.parse(inp.value,true);if(v===null||!isFinite(v)||v<0){const d=getDA(item)[pid]||{amount:0};inp.value=fmtComma(d.amount);return;}if(v>t)v=t;v=r4(v);a.amount=v;a.percentage=r4(t?(v/t)*100:0);a.locked=true;applyC(item);if(session)session.isDirty=true;invalidateBT();syncAssignmentRows(item,pid);}});}
function bindItemPctInput(inp,item){const pid=inp.dataset.pid;bindItemSplitInput(inp,{onInput:()=>{const raw=inp.value.replace(/,/g,'');if(!raw.includes('/')&&!/[+\-*]/.test(raw)){let s=NI.stripRaw(raw);s=NI.normDots(s);s=NI.normLeading(s);s=NI.limitInt(s,3);s=NI.truncDec(s,2);if(inp.value!==s){const pos=inp.selectionStart;inp.value=s;try{inp.setSelectionRange(pos,pos);}catch(_){}}}const v=NI.parsePct(inp.value);if(v!==null&&isFinite(v)&&v>=0){if(v>100){inp.value='100.00';livePreviewSplit(item,pid,100,'pct');return;}livePreviewSplit(item,pid,v,'pct');}},onCommit:()=>{const a=item.assignments.find(x=>x.personId===pid);if(!a)return;const t=getItemTotal(item);if(!t){inp.value='0.00';return;}let pct=NI.parsePct(inp.value);if(pct===null||!isFinite(pct)||pct<0){const d=getDA(item)[pid]||{percentage:0};inp.value=d.percentage.toFixed(2);return;}if(pct>100)pct=100;pct=r4(pct);a.percentage=pct;a.amount=r4((pct/100)*t);a.locked=true;applyC(item);if(session)session.isDirty=true;invalidateBT();syncAssignmentRows(item,pid);}});}

function _zeroNamesDisplay(names,ouPart,suffix,avail,font){
  if(measureTW(ouPart+names.join(' ')+suffix,font)<=avail)return names.join(' ');
  for(let i=names.length-1;i>=1;i--){const cand=ouPart+names.slice(0,i).join(' ')+` และคนอีก ${names.length-i} คน`+suffix;if(measureTW(cand,font)<=avail)return names.slice(0,i).join(' ')+` และคนอีก ${names.length-i} คน`;}
  return`${names.length} คน`;
}

function buildWarnHtml(item){
  const total=getItemTotal(item);
  if(!total||total<=0)return`<div class="wb wb-n">ใส่ราคาเพื่อเริ่มแบ่งบิล</div>`;
  if(!item.assignments||!item.assignments.length)return`<div class="wb wb-n">เลือกคนด้านล่างเพื่อเริ่มแบ่งบิล</div>`;
  const warns=getWarns(item);
  if(!warns.length)return`<div class="wb wb-ok">✓ แบ่งบิลเรียบร้อย</div>`;
  const overUnder=warns.find(w=>w.type==='over'||w.type==='under');
  const zeroWarns=warns.filter(w=>w.type==='zero');
  let html='';
  if(overUnder)html+=`<div class="wb wb-w">⚠ ${esc(overUnder.msg)}</div>`;
  if(zeroWarns.length){
    const warnEl=document.getElementById('item-warn-area');
    const avail=warnEl&&warnEl.clientWidth>50?warnEl.clientWidth-30:window.innerWidth-62;
    const font='400 13px "Sarabun",sans-serif';
    const names=zeroWarns.map(w=>{const p=S.people.find(x=>x.id===w.personId);return p?.name||'?';});
    const displayNames=_zeroNamesDisplay(names,'⚠ ',ZERO_SHARE_SUFFIX,avail,font);
    html+=`<div class="wb wb-w">⚠ ${esc(displayNames+ZERO_SHARE_SUFFIX)}</div>`;
  }
  if(!overUnder&&!zeroWarns.length)html+=`<div class="wb wb-w">⚠ ${esc(warns[0].msg)}</div>`;
  return html||`<div class="wb wb-ok">✓ แบ่งบิลเรียบร้อย</div>`;
}

function buildSummaryWarnLines(item,containerW){
  const warns=getWarns(item);if(!warns.length)return[];
  const noPriceWarn=warns.find(w=>w.type==='no_price');
  const overUnder=warns.find(w=>w.type==='over'||w.type==='under');
  const zeroWarns=warns.filter(w=>w.type==='zero');
  const lines=[];
  const font12='400 12px "Sarabun",sans-serif';
  const fontLink='400 13px "Sarabun",sans-serif';
  const wbInner=(containerW||window.innerWidth)-32-26;
  if(noPriceWarn){lines.push({hasLink:true,id:item.id,linkText:item.name||'ไม่มีชื่อ',text:noPriceWarn.msg});return lines;}
  if(overUnder)lines.push({hasLink:true,id:item.id,linkText:item.name||'ไม่มีชื่อ',text:overUnder.msg});
  if(zeroWarns.length){
    const names=zeroWarns.map(w=>{const p=S.people.find(x=>x.id===w.personId);return p?.name||'?';});
    if(overUnder){const avail=Math.max(wbInner-2,80);lines.push({hasLink:false,id:item.id,text:_zeroNamesDisplay(names,'',ZERO_SHARE_SUFFIX,avail,font12)+ZERO_SHARE_SUFFIX});}
    else{const itemNameW=measureTW(item.name||'ไม่มีชื่อ',fontLink);const avail=Math.max(wbInner-itemNameW-5,80);lines.push({hasLink:true,id:item.id,linkText:item.name||'ไม่มีชื่อ',text:_zeroNamesDisplay(names,'',ZERO_SHARE_SUFFIX,avail,font12)+ZERO_SHARE_SUFFIX});}
  }
  if(!overUnder&&!zeroWarns.length&&warns.length)lines.push({hasLink:true,id:item.id,linkText:item.name||'ไม่มีชื่อ',text:warns[0].msg});
  return lines;
}

async function downloadSummaryImage(){
  const bt=getCachedBT();
  if(!bt||!S.people.length){toast('ยังไม่มีข้อมูลสรุป');return;}
  await document.fonts.ready;

  const DPR=Math.min(window.devicePixelRatio||2,3);
  const CW=800,PAD=32,CP=20,GAP=10;
  const LH=28,ILH=25,CR=12;
  const HDR_H=90,FTR_H=64,SLH=36;
  const INNER=CW-PAD*2;

  const CC={
    bg:'#18150F',surf:'#211D17',card:'#2A2520',
    acc:'#C87D3E',text:'#F0EAE0',mut:'#87807A',dim:'#524D47',bdr:'#38332C',
    ok:'#5FAA78',red:'#D45050',accBg:'rgba(200,125,62,0.07)'
  };

  function pCardH(p){
    const items=S.items.filter(it=>it.assignments.some(a=>a.personId===p.id));
    let h=CP*2+44;
    if(items.length){
      h+=8+items.length*ILH+12+LH;
      if(S.service.enabled)h+=LH;if(S.tax.enabled)h+=LH;if(bt.D>0)h+=LH;
      h+=8+44;
    }else h+=LH;
    return h;
  }
  function bCardH(){
    let h=CP*2+LH;
    if(S.service.enabled)h+=LH;if(S.tax.enabled)h+=LH;if(bt.D>0)h+=LH;
    return h+=8+44;
  }
  let TH=HDR_H+PAD+SLH;
  S.people.forEach(p=>{if(bt.pt[p.id])TH+=pCardH(p)+GAP;});
  TH+=16+SLH+bCardH()+GAP+PAD+FTR_H;

  const canvas=document.createElement('canvas');
  canvas.width=CW*DPR;canvas.height=TH*DPR;
  const ctx=canvas.getContext('2d');
  ctx.scale(DPR,DPR);

  function rr(x,y,w,h,r){
    const rs=typeof r==='number'?[r,r,r,r]:r;
    const[tl,tr,br,bl]=rs;
    ctx.beginPath();
    ctx.moveTo(x+tl,y);ctx.lineTo(x+w-tr,y);ctx.quadraticCurveTo(x+w,y,x+w,y+tr);
    ctx.lineTo(x+w,y+h-br);ctx.quadraticCurveTo(x+w,y+h,x+w-br,y+h);
    ctx.lineTo(x+bl,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-bl);
    ctx.lineTo(x,y+tl);ctx.quadraticCurveTo(x,y,x+tl,y);
    ctx.closePath();
  }
  function hline(yy,x1=PAD+CP,x2=CW-PAD-CP){ctx.strokeStyle=CC.bdr;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x1,yy);ctx.lineTo(x2,yy);ctx.stroke();}
  function t(text,x,yy,font,color,align='left'){ctx.font=font;ctx.fillStyle=color;ctx.textAlign=align;ctx.fillText(text,x,yy);ctx.textAlign='left';}
  function trunc(text,maxW){
    if(ctx.measureText(text).width<=maxW)return text;
    let s=text;
    while(s.length>1&&ctx.measureText(s+'…').width>maxW)s=s.slice(0,-1);
    return s+'…';
  }

  ctx.fillStyle=CC.bg;ctx.fillRect(0,0,CW,TH);

  ctx.fillStyle=CC.surf;ctx.fillRect(0,0,CW,HDR_H);
  hline(HDR_H,0,CW);

  ctx.font='400 18px "Prompt",sans-serif';ctx.fillStyle=CC.mut;
  ctx.fillText('หารจ่าย',PAD,56);
  const preW=ctx.measureText('หารจ่าย').width;
  t('แฟร์ๆ',PAD+preW+5,60,'800 36px "Kanit",sans-serif',CC.acc);

  const now=new Date();
  const dStr=now.toLocaleDateString('th-TH',{year:'numeric',month:'long',day:'numeric'})+' '+now.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
  t(dStr,CW-PAD,56,'400 12px "Sarabun",sans-serif',CC.dim,'right');

  let y=HDR_H+PAD;
  t('รายคน',PAD,y+20,'700 11px "Sarabun",sans-serif',CC.dim);
  y+=SLH;

  S.people.forEach(p=>{
    const pt=bt.pt[p.id];if(!pt)return;
    const items=S.items.filter(it=>it.assignments.some(a=>a.personId===p.id));
    const cH=pCardH(p);const neg=pt.total<0;const hw=getPWarn(p.id);

    rr(PAD,y,INNER,cH,CR);ctx.fillStyle=CC.card;ctx.fill();
    rr(PAD,y,INNER,cH,CR);ctx.strokeStyle=CC.bdr;ctx.lineWidth=1;ctx.stroke();

    let cy=y+CP;
    const pNameDisp=trunc((hw?'⚠ ':'')+p.name,INNER-CP*2-180);
    t(pNameDisp,PAD+CP,cy+28,'600 16px "Sarabun",sans-serif',hw?CC.red:CC.text);
    t(fmt(pt.total),CW-PAD-CP,cy+30,'700 20px "Sarabun",sans-serif',neg?CC.red:CC.acc,'right');
    cy+=44;

    if(items.length){
      hline(cy);cy+=8;
      items.forEach(it=>{
        const d=getDA(it)[p.id]||{amount:0};
        const nm=trunc(it.name||'ไม่มีชื่อเมนู',INNER-CP*2-160);
        t(nm,PAD+CP,cy+17,'400 13px "Sarabun",sans-serif',CC.text);
        t(fmt(d.amount),CW-PAD-CP,cy+17,'400 13px "Sarabun",sans-serif',CC.mut,'right');
        cy+=ILH;
      });
      cy+=12;hline(cy);

      function bRow(lbl,val,vc=CC.text){
        t(lbl,PAD+CP,cy+LH-7,'400 13px "Sarabun",sans-serif',CC.mut);
        t(val,CW-PAD-CP,cy+LH-7,'500 13px "Sarabun",sans-serif',vc,'right');
        cy+=LH;
      }
      bRow('ยอดรวมย่อย',fmt(pt.subtotal));
      if(S.service.enabled)bRow(`Service Charge (${S.service.value}%)`,`+${fmt(pt.service)}`);
      if(S.tax.enabled)bRow(`VAT (${S.tax.value}%)`,`+${fmt(pt.vat)}`);
      if(bt.D>0)bRow('ส่วนลด',`−${fmt(pt.discount)}`,CC.ok);
      cy+=8;hline(cy);

      rr(PAD,y+cH-(44+CP),INNER,44+CP,[0,0,CR,CR]);
      ctx.fillStyle=CC.accBg;ctx.fill();
      t('ยอดรวม',PAD+CP,cy+30,'600 14px "Sarabun",sans-serif',CC.mut);
      t(fmt(pt.total),CW-PAD-CP,cy+32,'700 20px "Sarabun",sans-serif',neg?CC.red:CC.acc,'right');
    }else{
      t('⚠ ยังไม่ได้เลือกเมนูใด',PAD+CP,cy+22,'400 13px "Sarabun",sans-serif',CC.red);
    }
    y+=cH+GAP;
  });

  y+=16;
  t('ยอดรวมบิล',PAD,y+20,'700 11px "Sarabun",sans-serif',CC.dim);
  y+=SLH;

  const bcH=bCardH();
  rr(PAD,y,INNER,bcH,CR);ctx.fillStyle=CC.card;ctx.fill();
  rr(PAD,y,INNER,bcH,CR);ctx.strokeStyle=CC.bdr;ctx.lineWidth=1;ctx.stroke();

  let by=y+CP;
  function bilRow(lbl,val,vc=CC.text){
    t(lbl,PAD+CP,by+LH-6,'400 14px "Sarabun",sans-serif',CC.mut);
    t(val,CW-PAD-CP,by+LH-6,'500 14px "Sarabun",sans-serif',vc,'right');

  }
  bilRow('ยอดรวมย่อย',fmt(bt.Sb));
  if(S.service.enabled)bilRow(`Service Charge (${S.service.value}%)`,`+${fmt(bt.svcAmt)}`);
  if(S.tax.enabled)bilRow(`VAT (${S.tax.value}%)`,`+${fmt(bt.vatAmt)}`);
  if(bt.D>0)bilRow('ส่วนลด',`−${fmt(bt.D)}`,CC.ok);
  by+=8;hline(by);

  rr(PAD,y+bcH-(44+CP),INNER,44+CP,[0,0,CR,CR]);
  ctx.fillStyle=CC.accBg;ctx.fill();
  t('ยอดรวมสุทธิ',PAD+CP,by+30,'600 14px "Sarabun",sans-serif',CC.mut);
  t(fmt(bt.grand),CW-PAD-CP,by+34,'700 22px "Sarabun",sans-serif',CC.acc,'right');

  y+=bcH+PAD;
  t('หารจ่าย แฟร์ๆ',CW/2,y+22,'600 13px "Sarabun",sans-serif',CC.dim,'center');
  t('UX Design by Map Tharit Banchanurat',CW/2,y+40,'400 11px "Sarabun",sans-serif',CC.dim,'center');

  canvas.toBlob(blob=>{
    if(!blob){
      const dUrl=canvas.toDataURL('image/jpeg',0.92);
      const w=window.open('','_blank');
      if(w){w.document.write(`<body style="background:#18150F;margin:0;padding:16px"><img src="${dUrl}" style="max-width:100%;border-radius:8px"><p style="color:#87807A;font-size:12px;margin-top:8px">กด long press → บันทึกรูปภาพ</p></body>`);return;}
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='FairShare.jpg';
    document.body.appendChild(a);a.click();
    setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(url);},100);
    toast('บันทึกรูปภาพสำเร็จ ✓');
  },'image/jpeg',0.92);
}

function openItemSess(itemId,isNew=false){activeItemId=itemId;const snap=isNew?null:clone(S.items.find(i=>i.id===itemId));session={itemId,snapshot:snap,isDirty:false};goto('item-detail');}
function teardownItemDetail(){if(chipLayoutObserver){chipLayoutObserver.disconnect();chipLayoutObserver=null;}if(warnAreaObserver){warnAreaObserver.disconnect();warnAreaObserver=null;}if(doneObserver){doneObserver.disconnect();doneObserver=null;}document.getElementById('sticky-done-wrap').style.display='none';}
function addNewItem(){if(session){toast('กรุณาจบการแก้ไขปัจจุบันก่อน');return;}const it={id:gid(),name:'',price:0,quantity:1,assignments:[]};S.items.push(it);openItemSess(it.id,true);}

function relayoutChips(){if(view!=='item-detail'||!activeItemId)return;const item=S.items.find(i=>i.id===activeItemId);if(!item)return;cancelAnimationFrame(chipLayoutRAF);chipLayoutRAF=requestAnimationFrame(()=>{if(view!=='item-detail')return;initChipLayout(item);});}

function handleViewportChange(){
  cancelAnimationFrame(resizeRAF);
  resizeRAF=requestAnimationFrame(()=>{
    invalidateLayoutCache();
    if(view==='item-detail'){
      const tl=isItemDetailTwoLine();
      if(tl!==_lastTwoLine){_lastTwoLine=tl;renderItemDetail();}
      else{relayoutChips();const item=S.items.find(i=>i.id===activeItemId);if(item){const wd=document.getElementById('item-warn-area');if(wd)wd.innerHTML=buildWarnHtml(item);}}
    }else if(view==='people'){
      // Do NOT re-render people page on viewport changes (keyboard open/close on Android).
    }else{
      render();
    }
  });
}

function updatePeoplePreview(){const na=document.getElementById('people-names-area');if(!na||!S.people.length)return;const maxW=na.clientWidth||na.getBoundingClientRect().width||300;const sp=document.getElementById('people-names-span');if(sp)sp.textContent=buildPeoplePreview(S.people,maxW);}
function buildPeoplePreview(people,maxWidth){if(!people.length)return'';const full=people.map(p=>p.name).join(', ');if(measureTW(full)<=maxWidth)return full;for(let count=people.length-1;count>=1;count--){const shown=people.slice(0,count).map(p=>p.name).join(', ');const ov=people.length-count;const cand=shown+` และอีก ${ov} คน`;if(measureTW(cand)<=maxWidth)return cand;}const ov=people.length-1;return people[0].name+(ov>0?` และอีก ${ov} คน`:'');}

function doneAction(){
  const item=S.items.find(i=>i.id===activeItemId);if(!item)return;
  if(isItemDefault(item)){
    teardownItemDetail();
    const idx=S.items.findIndex(i=>i.id===activeItemId);
    if(idx>=0){if(session&&session.snapshot)S.items[idx]=session.snapshot;else S.items.splice(idx,1);}
    session=null;saveS();goto(prevView);return;
  }
  const hasOtherInput=(item.price>0)||(item.quantity>1)||(item.assignments.length>0);
  const ne=document.getElementById('it-name-err');
  if(ne)ne.style.display='none';
  if(!item.name.trim()&&hasOtherInput){
    if(ne){ne.textContent='ชื่อเมนูห้ามว่าง';ne.style.display='block';}
    document.getElementById('it-name')?.focus();
    return;
  }
  teardownItemDetail();session=null;invalidateBT();saveS();updateTabGlow();goto(prevView);
}

async function handleBack(){
  if(view==='item-detail'){
    const item=S.items.find(i=>i.id===activeItemId);
    if(item){
      if(isItemDefault(item)){teardownItemDetail();const idx=S.items.findIndex(i=>i.id===activeItemId);if(idx>=0){if(session&&session.snapshot)S.items[idx]=session.snapshot;else S.items.splice(idx,1);}session=null;saveS();goto(prevView);return;}
      if(session&&session.isDirty){const c=await modal('ต้องการละทิ้งการเปลี่ยนแปลงหรือไม่?','การแก้ไขจะไม่ถูกบันทึก',[{label:'แก้ต่อ',val:'keep',cls:'btn-p'},{label:'ละทิ้ง',val:'discard',cls:'btn-s'}]);if(c!=='discard')return;}
    }
    if(session){const idx=S.items.findIndex(i=>i.id===session.itemId);if(idx>=0){if(session.snapshot)S.items[idx]=session.snapshot;else S.items.splice(idx,1);}session=null;}
    teardownItemDetail();goto(prevView);
  }else if(view==='people'){
    editingPid=null;saveS();
    if(peopleReturnTo){const rt=peopleReturnTo;peopleReturnTo=null;if(rt.view==='item-detail'){goto('item-detail',{itemId:rt.itemId});return;}}
    goto('menu');
  }
}
async function handleTabClick(dest){
  if(view==='item-detail'){await handleBack();return;}
  if(view==='people'){editingPid=null;if(peopleReturnTo&&session){const idx=S.items.findIndex(i=>i.id===session.itemId);if(idx>=0){if(session.snapshot)S.items[idx]=session.snapshot;else S.items.splice(idx,1);}session=null;}peopleReturnTo=null;saveS();goto(dest);return;}
  editingPid=null;
  if(dest==='summary'&&shouldShowSummaryGlow()){summaryGlowDismissed=true;try{localStorage.setItem('sgd','1');}catch(e){}}
  goto(dest);
}

function render(){if(view==='menu')renderMenu();else if(view==='people')renderPeople();else if(view==='item-detail')renderItemDetail();else if(view==='summary')renderSummary();}

function isDuplicateName(name,excludeId=null){const n=name.trim().toLowerCase();return S.people.some(p=>p.id!==excludeId&&p.name.trim().toLowerCase()===n);}

function renderPeople(){
  const el=document.getElementById('screen-people');let h='';
  h+=`<div class="card" style="padding:13px;margin-bottom:16px"><label class="inp-lbl">เพิ่มคน</label><div style="display:flex;gap:7px;align-items:center;margin-top:5px"><input id="np-inp" class="inp" type="text" maxlength="30" placeholder="ชื่อจริงหรือชื่อเล่น" autocomplete="off" enterkeyhint="done" style="flex:1;padding:9px 11px 12px"><button class="btn btn-p" id="np-add-btn" type="button" style="flex-shrink:0;padding:10px 16px">เพิ่ม</button></div><div id="np-err" class="inp-err" style="display:none;margin-top:5px"></div></div>`;
  h+=`<div id="people-list-wrap"></div>`;
  el.innerHTML=h;
  document.getElementById('sticky-done-wrap').style.display='block';
  document.getElementById('btn-done-sticky').onclick=handleBack;
  const npInp=document.getElementById('np-inp');
  document.getElementById('np-add-btn').addEventListener('click',()=>doAddPerson());
  npInp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();doAddPerson();}});
  npInp.addEventListener('input',()=>{const err=document.getElementById('np-err');if(err)err.style.display='none';});

function renderPeopleList(){
  const wrap=document.getElementById('people-list-wrap');if(!wrap)return;let h='';
  if(!S.people.length){h+=`<div class="empty" style="padding:28px 20px"><div class="empty-ico">👥</div><div class="empty-txt">ยังไม่มีรายชื่อคน</div></div>`;}
  else{const n=S.people.length;h+=`<div class="shdr" style="margin-top:0"><span class="stitle">คน · ${n}</span></div><div class="card"><div class="p2col">`;S.people.forEach((p,idx)=>{const isRight=idx%2===1;const lastRowStart=Math.floor((n-1)/2)*2;const isLastRow=idx>=lastRowStart;const br=isRight?'':'border-right:1px solid var(--b);';const bb=isLastRow?'':'border-bottom:1px solid var(--b);';if(editingPid===p.id){h+=`<div class="p2cell-edit" style="${bb}"><input id="ep-${p.id}" class="inp" type="text" value="${esc(p.name)}" maxlength="30" autocomplete="off" enterkeyhint="done" style="flex:1;padding:8px 10px 12px"><button class="btn btn-p" data-a="ep-save" data-id="${p.id}" style="flex-shrink:0;padding:8px 12px">✓</button><button class="btn btn-s" data-a="ep-cancel" style="flex-shrink:0;padding:8px 10px">✕</button></div>`;}else{h+=`<div class="p2cell" style="${br}${bb}"><span class="p2cell-name">${esc(p.name)}</span><button class="btn-icon" data-a="rename-p" data-id="${p.id}" style="width:28px;height:28px"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14c0 1.1.9 2 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button><button class="btn-icon" data-a="del-p" data-id="${p.id}" style="color:var(--rh);width:28px;height:28px">${ICONS.bin}</button></div>`;}});h+=`</div></div>`;}
  wrap.innerHTML=h;
  wrap.querySelectorAll('[data-a="rename-p"]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();editingPid=e.dataset.id;renderPeopleList();setTimeout(()=>document.getElementById('ep-'+e.dataset.id)?.focus(),40);}));
  wrap.querySelectorAll('[data-a="ep-save"]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();doEditPerson(e.dataset.id);}));
  wrap.querySelectorAll('[data-a="ep-cancel"]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();editingPid=null;renderPeopleList();}));
  S.people.forEach(p=>{const inp=document.getElementById('ep-'+p.id);if(inp){NI.addTriggers(inp,()=>doEditPerson(p.id));inp.addEventListener('keydown',e=>{if(e.key==='Escape'){editingPid=null;renderPeopleList();}});}});
  wrap.querySelectorAll('[data-a="del-p"]').forEach(e=>e.addEventListener('click',ev=>{ev.stopPropagation();doDelPerson(e.dataset.id);}));

function doAddPerson(){const inp=document.getElementById('np-inp'),err=document.getElementById('np-err'),name=inp.value.trim();if(!name){if(err){err.textContent='ชื่อห้ามว่าง';err.style.display='block';}return;}if(isDuplicateName(name)){if(err){err.textContent='ชื่อนี้ถูกใช้แล้ว';err.style.display='block';}return;}S.people.push({id:gid(),name});inp.value='';if(err)err.style.display='none';invalidateBT();saveS();renderPeopleList();inp.focus();}
function doEditPerson(id){const inp=document.getElementById('ep-'+id);if(!inp)return;const name=inp.value.trim();if(!name){toast('ชื่อห้ามว่าง');return;}if(isDuplicateName(name,id)){toast('ชื่อนี้ถูกใช้แล้ว');return;}const p=S.people.find(x=>x.id===id);if(p)p.name=name;_chipWidthCache.delete(id);editingPid=null;saveS();renderPeopleList();}

async function doDelPerson(id){
  const p=S.people.find(x=>x.id===id);if(!p)return;
  if(S.items.some(it=>it.assignments.some(a=>a.personId===id))){
    const c=await confirmDelete(p.name,`<em>${esc(p.name)}</em> จะถูกลบออกจากทุกเมนูอาหาร`,{confirmLabel:'ลบออก',bodyHtml:true});
    if(c!=='y')return;
  }
  S.items.forEach(it=>{it.assignments=it.assignments.filter(a=>a.personId!==id);applyC(it);});
  S.people=S.people.filter(x=>x.id!==id);pruneCollapsedPeople();invalidateBT();saveS();renderPeopleList();
}

const _chipWidthCache=new Map();
function getChipWidth(pid,name,ctx){if(_chipWidthCache.has(pid))return _chipWidthCache.get(pid);const w=Math.ceil(ctx.measureText(name).width)+28+4;_chipWidthCache.set(pid,w);return w;}
function clearChipWidthCache(){_chipWidthCache.clear();}
function getChipHighlight(item){if(!S.people.length)return{allAct:false,noneAct:false};const ids=new Set(item.assignments.map(a=>a.personId));return{allAct:S.people.every(p=>ids.has(p.id)),noneAct:!S.people.some(p=>ids.has(p.id))};}

function initChipLayout(item){
  const cardEl=document.getElementById('chip-area');if(!cardEl||!S.people.length)return;
  const GAP=7,VGAP=7,FONT='500 13px "Sarabun",sans-serif';
  const canvas=document.createElement('canvas');const ctx=canvas.getContext('2d');ctx.font=FONT;
  const rawW=cardEl.clientWidth||Math.max(window.innerWidth-60,120);const W=rawW-28;
  const chips=S.people.map(p=>({p,w:getChipWidth(p.id,p.name,ctx)}));
  const rows=[];let row=[],rowW=0;
  for(const chip of chips){const nextW=row.length?rowW+GAP+chip.w:chip.w;if(row.length&&nextW>W){rows.push(row);row=[chip];rowW=chip.w;}else{row.push(chip);rowW=nextW;}}
  if(row.length)rows.push(row);
  if(rows.length>=2){let last=rows[rows.length-1],prev=rows[rows.length-2];const widthOf=arr=>arr.reduce((s,c,i)=>s+c.w+(i?GAP:0),0);let lastW=widthOf(last),prevW=widthOf(prev);while(prev.length>1&&lastW/prevW<0.5){const moved=prev[prev.length-1];const newPrev=prev.slice(0,-1);const newLast=[moved,...last];const newPrevW=widthOf(newPrev),newLastW=widthOf(newLast);if(newPrevW<=W&&newLastW<=W&&newLastW/newPrevW>=0.5){prev=newPrev;last=newLast;rows[rows.length-2]=prev;rows[rows.length-1]=last;}else break;prevW=widthOf(prev);lastW=widthOf(last);}}
  let html=`<div style="padding:12px 14px;display:flex;flex-direction:column;gap:${VGAP}px">`;
  rows.forEach(row=>{html+=`<div style="display:flex;gap:${GAP}px;flex-wrap:nowrap">`;row.forEach(({p})=>{const sel=item.assignments.some(a=>a.personId===p.id);html+=`<div data-a="chip-p" data-pid="${p.id}" style="padding:7px 14px;border-radius:100px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s ease;white-space:nowrap;flex-shrink:0;border:1.5px solid ${sel?'var(--a)':'var(--bl)'};background:${sel?'var(--ad)':'transparent'};color:${sel?'var(--a)':'var(--tm)'}">${esc(p.name)}</div>`;});html+=`</div>`;});
  html+=`</div>`;cardEl.innerHTML=html;
  cardEl.querySelectorAll('[data-a="chip-p"]').forEach(c=>{c.addEventListener('click',()=>{const pid=c.dataset.pid;const idx=item.assignments.findIndex(a=>a.personId===pid);if(idx>=0)item.assignments.splice(idx,1);else item.assignments.push({personId:pid,amount:0,percentage:0,locked:false});applyC(item);invalidateBT();if(session)session.isDirty=true;renderItemDetail();});});
}

      if(assigned.length){
        h+=`<div class="sbd">`;
        assigned.forEach(it=>{const a=it.assignments.find(x=>x.personId===p.id);if(!a)return;const d=getDA(it)[p.id]||{amount:a.amount||0,percentage:a.percentage||0};const itW=getWarns(it).length>0,qty2=it.quantity||1;h+=`<div class="pdrow" style="cursor:pointer" data-a="go-edit-item" data-iid="${it.id}"><div class="pdi"><div class="pdn">${it.name?esc(it.name):`<em style="color:var(--td)">ไม่มีชื่อเมนู</em>`}</div><div class="pds"><span>${fmt(d.amount)}</span><span>·</span><span>${fP(d.percentage)}</span>${qty2>1?`<span style="color:var(--td)">จาก ${fmt(it.price||0,'฿')}×${qty2}</span>`:''}${a.locked?'<span class="lk-chip">ล็อค</span>':''}</div></div><div class="pdr">${itW?`<span style="color:var(--rs);font-size:13px" title="${esc(getWarns(it).map(w=>w.msg).join(', '))}">⚠</span>`:''}<button class="btn-icon" data-a="rm-p-from-item" data-pid="${p.id}" data-iid="${it.id}" style="color:var(--rh)" title="ลบออกจากเมนู">${ICONS.bin}</button></div></div>`;});
        h+=`<div style="border-top:1px solid var(--b);padding-top:4px;margin-top:2px">`;
        h+=`<div class="trow" style="padding:7px 0;border-bottom:none"><span class="tlbl">ยอดรวมย่อย</span><span class="tval">${fmt(pt.subtotal)}</span></div>`;
        if(S.service.enabled)h+=`<div class="trow" style="padding:5px 0;border-bottom:none"><span class="tlbl">Service Charge (${S.service.value}%)</span><span class="tval">+${fmt(pt.service)}</span></div>`;
        if(S.tax.enabled)h+=`<div class="trow" style="padding:5px 0;border-bottom:none"><span class="tlbl">VAT (${S.tax.value}%)</span><span class="tval">+${fmt(pt.vat)}</span></div>`;
        if(bt.D>0)h+=`<div class="trow" style="padding:5px 0;border-bottom:none"><span class="tlbl">ส่วนลด</span><span class="tval" style="color:var(--ok)">−${fmt(pt.discount)}</span></div>`;
        h+=`<div class="trow grand" style="border-radius:0 0 var(--r) var(--r);margin-top:2px"><span class="tlbl">ยอดรวม</span><span class="tval${neg?' neg':' pos'}">${fmt(pt.total)}</span></div></div></div>`;
      }
    }
    h+=`</div>`;
  });
  h+=`<div class="shdr"><span class="stitle">ยอดรวมบิล</span></div><div class="totals" style="margin-bottom:14px">`;
  h+=`<div class="trow"><span class="tlbl">ยอดรวมย่อย</span><span class="tval">${fmt(bt.Sb)}</span></div>`;
  if(S.service.enabled)h+=`<div class="trow"><span class="tlbl">Service Charge (${S.service.value}%)</span><span class="tval">+${fmt(bt.svcAmt)}</span></div>`;
  if(S.tax.enabled)h+=`<div class="trow"><span class="tlbl">VAT (${S.tax.value}%)</span><span class="tval">+${fmt(bt.vatAmt)}</span></div>`;
  if(bt.D>0)h+=`<div class="trow"><span class="tlbl">ส่วนลด</span><span class="tval" style="color:var(--ok)">−${fmt(bt.D)}</span></div>`;
  h+=`<div class="trow grand"><span class="tlbl">ยอดรวมสุทธิ</span><span class="tval pos">${fmt(bt.grand)}</span></div></div>`;
  h+=`<button class="btn btn-p" id="btn-download-summary" style="width:100%;margin-bottom:18px;gap:8px">${ICONS.download} บันทึกสรุปยอดเป็นรูปภาพ</button>`;
  el.innerHTML=h;
  el.querySelectorAll('[data-a="toggle-coll"]').forEach(e=>e.addEventListener('click',()=>{const pid=e.dataset.pid;if(collapsedPeople.has(pid))collapsedPeople.delete(pid);else collapsedPeople.add(pid);renderSummary();}));
  el.querySelector('#btn-expand-all').addEventListener('click',()=>{collapsedPeople.clear();renderSummary();});
  el.querySelector('#btn-collapse-all').addEventListener('click',()=>{S.people.forEach(p=>collapsedPeople.add(p.id));renderSummary();});
  el.querySelectorAll('[data-a="go-item"]').forEach(e=>e.addEventListener('click',()=>{if(session){toast('กรุณาจบการแก้ไขปัจจุบันก่อน');return;}openItemSess(e.dataset.id);}));
  el.querySelectorAll('[data-a="go-edit-item"]').forEach(e=>e.addEventListener('click',ev=>{if(ev.target.closest('[data-a="rm-p-from-item"]'))return;if(session){toast('กรุณาจบการแก้ไขปัจจุบันก่อน');return;}openItemSess(e.dataset.iid);}));
  el.querySelectorAll('[data-a="rm-p-from-item"]').forEach(e=>e.addEventListener('click',async ev=>{ev.stopPropagation();const it=S.items.find(i=>i.id===e.dataset.iid),p=S.people.find(x=>x.id===e.dataset.pid);if(!it||!p)return;const remaining=it.assignments.filter(a=>a.personId!==e.dataset.pid).length;const titleHtml=`ลบ <em>${esc(it.name||'เมนูนี้')}</em> ออกจาก <em>${esc(p.name)}</em> ใช่ไหม?`;const bodyHtml=remaining>0?`ส่วนแบ่งของ <em>${esc(p.name)}</em> จะถูกหารเท่าๆกันกับคนที่เหลืออีก ${remaining} คน`:`<em>${esc(p.name)}</em> เป็นคนเดียวในเมนูนี้ เมนูนี้จะกลายเป็นยังไม่มีคนเลือก`;const c=await modal(titleHtml,bodyHtml,[{label:'ยกเลิก',val:'n',cls:'btn-s'},{label:'ลบออก',val:'y',cls:'btn-d-strong'}],{titleHtml:true,bodyHtml:true});if(c!=='y')return;it.assignments=it.assignments.filter(a=>a.personId!==e.dataset.pid);applyC(it);invalidateBT();saveS();renderSummary();}));
  el.querySelector('#btn-download-summary')?.addEventListener('click',downloadSummaryImage);
  attachDistHandlers(el);
}

function attachDistHandlers(el){el.querySelectorAll('[data-sd]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled){S.serviceDist=b.dataset.sd;invalidateBT();saveS();renderSummary();}}));el.querySelectorAll('[data-dd]').forEach(b=>b.addEventListener('click',()=>{if(!b.disabled){S.discountDist=b.dataset.dd;invalidateBT();saveS();renderSummary();}}));}

loadS();
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>handleTabClick(b.dataset.tab)));
document.getElementById('btn-back').addEventListener('click',handleBack);
window.addEventListener('resize',handleViewportChange);
window.addEventListener('orientationchange',handleViewportChange);
if(window.visualViewport)window.visualViewport.addEventListener('resize',handleViewportChange);
document.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT')setTimeout(()=>e.target.scrollIntoView({block:'center',behavior:'smooth'}),300);});
document.getElementById('btn-newbill').addEventListener('click',async()=>{
  while(true){
    const c=await modal('เริ่มบิลใหม่ใช่ไหม?','เลือกว่าจะลบทั้งหมดหรือลบเพียงเมนูอาหาร การกระทำนี้ไม่สามารถย้อนกลับได้',[{label:'ลบทั้งหมด',val:'clear',cls:'btn-d-strong'},{label:'เก็บรายชื่อคนไว้ ลบเมนู',val:'keep',cls:'btn-warn'},{label:'ยกเลิก',val:'cancel',cls:'btn-g'}],{col:true});
    if(c==='cancel')return;
    const msg=c==='keep'?'เมนูทั้งหมดและข้อมูลการหารจ่ายทั้งหมดจะถูกลบถาวร และจะเก็บรายชื่อคนไว้':'รายชื่อคน เมนูทั้งหมด และข้อมูลการหารจ่ายทั้งหมดจะถูกลบถาวร';
    const c2=await modal('แน่ใจแล้วใช่ไหม?',msg,[{label:'ย้อนกลับ',val:'back',cls:'btn-s'},{label:'ใช่ ลบทันที',val:'yes',cls:'btn-d-strong'}]);
    if(c2==='yes'){const kp=c==='keep'?[...S.people]:[];S={people:kp,items:[],tax:{value:7,enabled:false},service:{value:10,enabled:false},discount:{mode:'percent',value:0,placement:'after_sc_vat'},serviceDist:'equal',discountDist:'equal'};collapsedPeople.clear();session=null;editingPid=null;peopleReturnTo=null;summaryGlowDismissed=false;try{localStorage.removeItem('sgd');}catch(e){}clearChipWidthCache();invalidateBT();saveS();goto('menu');return;}
  }
});
document.getElementById('modal-ov').addEventListener('click',e=>{if(e.target===document.getElementById('modal-ov'))closeModal('cancel');});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mRes)closeModal('cancel');});
goto('menu');
if(document.fonts?.ready)document.fonts.ready.then(()=>{if(view==='menu'||view==='summary'||view==='item-detail')render();});
</script>
</body>
</html>
