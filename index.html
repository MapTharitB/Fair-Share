<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>หารจ่ายแฟร์ๆ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="./assets/fonts.css?v=88504fccba1d652759206c5fc2114a4ed783ebe45cbce05d986e82b92f4893bc">
<link rel="stylesheet" href="./assets/design-tokens.css?v=cf694f380ed76e6b257cc00939063b4b37b140f7c24745bf149fee3515107a97">
<link rel="stylesheet" href="./assets/ui-components.css?v=f0b498a42cbb963f4ea58f2d060fdac083bcab24996d40c79c1c770d23824b77">
<link rel="stylesheet" href="./assets/main-integration.css?v=b144bfacaa16957f32a4638847fa0c6aa9ee8b08abbc56e046894f5453469cc6">
<link rel="stylesheet" href="./assets/segmented-controls.css?v=e87c863f8043aeb21868325d4b840ea9a76b353ba90cc18c463874e25532ea13">
<link rel="stylesheet" href="./assets/history-controls.css?v=aa63c2050bb9d89f8b304e68f821c336d3ac411ace107254c8a2b12d1d8fecd4">
<link rel="stylesheet" id="dialog-sheet-style" href="./assets/dialog-sheet.css?v=30e420e1344a4ec5e630e9aeef405b6381130cf36718996e7aee7b34721c7695">
<link rel="modulepreload" href="./src/fairshare-ui.bundle.mjs?v=a23eb4118d0ae528458ae63462e73f504add018f167d8ca83a0c0be8204ee64c">
</head>
<body>
<input type="file" id="backup-file" accept=".json,application/json" hidden>
<div id="app">
<header id="hdr">
  <div class="hdr-l">
    <button class="btn-back" id="btn-back" aria-label="ย้อนกลับ">
      <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div id="hdr-title">
      <span class="title-pre">หารจ่าย</span>
      <span class="title-main">แฟร์ๆ</span>
    </div>
  </div>
  <div id="header-history" class="history-controls"></div>
  <div id="hdr-item-total" tabindex="0"></div>
</header>
<div id="top-tabs">
  <button class="tab-btn active" data-tab="menu">
    <svg viewBox="0 0 24 24"><path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7"/></svg>
    เมนู
  </button>
  <button class="tab-btn" data-tab="summary">
    <svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
    สรุปยอด
  </button>
</div>
<div id="bill-context">
  <label id="bill-selector-label" for="bill-selector-name">ชื่อบิล</label>
  <div id="bill-name-control"><input id="bill-selector-name" name="bill-name" type="text" autocomplete="off" enterkeyhint="done" aria-labelledby="bill-selector-label" aria-describedby="bill-name-error" placeholder="ร้านอาหาร 1" disabled><button type="button" id="bill-selector" aria-haspopup="listbox" aria-controls="bill-selection-list" aria-expanded="false" aria-label="เลือกบิล" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M5 8h14l-7 8z"/></svg></button></div>
  <button type="button" id="bill-actions" aria-label="ตัวเลือกบิล" aria-haspopup="menu" aria-controls="bill-actions-menu" aria-expanded="false" disabled><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button>
</div>
<button type="button" id="old-work" class="btn btn-s" hidden>ตรวจสอบสิ่งที่แก้ไว้จากแท็บเดิม</button>
<div id="bill-name-feedback" hidden><p id="bill-name-error" role="alert"></p></div>
<main id="main">
  <div id="screen-menu" class="screen active"><p class="empty" role="status">กำลังเปิดบิล…</p></div>
  <div id="screen-people" class="screen"></div>
  <div id="screen-item-detail" class="screen"></div>
  <div id="screen-summary" class="screen"></div>
</main>
<footer id="app-footer">
  <div class="credit-row">
    <span class="credit-by">UX Design by Map Tharit Banchanurat</span>
    <span class="credit-ver">v2.00</span>
  </div>
</footer>
<div id="sticky-done-wrap">
  <button class="btn btn-p btn--full btn--done" id="btn-done-sticky">เสร็จสิ้น</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</div><!-- #app -->

<script src="./src/startup.mjs" data-entry="./src/fairshare-ui.bundle.mjs?v=a23eb4118d0ae528458ae63462e73f504add018f167d8ca83a0c0be8204ee64c"></script>
</body>
</html>
